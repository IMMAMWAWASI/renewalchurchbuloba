# Deploy Vite website to GitHub Pages
name: Deploy Renewal Church Buloba

on:
  push:
    branches: ["main"]

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      # Get the website files
      - name: Checkout
        uses: actions/checkout@v4

      # Install Node.js
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      # Install the website packages
      - name: Install dependencies
        run: npm ci

      # Build the Vite website
      - name: Build website
        run: npm run build

      # Prepare GitHub Pages
      - name: Setup Pages
        uses: actions/configure-pages@v5

      # Upload the finished website
      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: './dist'

      # Publish the website
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
